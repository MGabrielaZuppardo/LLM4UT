<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>Pipeline LLM4UT — visão geral</title>
  <desc>Diagrama mostrando as 5 etapas do pipeline: Benchmark, Geração de Prompts, Inferência LLM, Execução e Avaliação, e Métricas.</desc>

  <!-- background -->
  <rect width="700" height="420" fill="#ffffff" rx="12"/>

  <!-- ETAPA 1: BENCHMARK -->
  <rect x="20" y="60" width="116" height="300" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
  <rect x="20" y="60" width="116" height="28" rx="8" fill="#378ADD"/>
  <rect x="20" y="76" width="116" height="12" fill="#378ADD"/>
  <text x="78" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Benchmark</text>

  <rect x="30" y="102" width="96" height="44" rx="5" fill="#fff" stroke="#B5D4F4" stroke-width="1"/>
  <text x="78" y="120" text-anchor="middle" font-size="10" font-weight="500" fill="#0C447C">Defects4J 2.0</text>
  <text x="78" y="133" text-anchor="middle" font-size="9" fill="#378ADD">17 projetos Java</text>

  <rect x="30" y="154" width="96" height="44" rx="5" fill="#fff" stroke="#B5D4F4" stroke-width="1"/>
  <text x="78" y="171" text-anchor="middle" font-size="10" font-weight="500" fill="#0C447C">Métodos Focais</text>
  <text x="78" y="184" text-anchor="middle" font-size="9" fill="#378ADD">778 unidades</text>

  <rect x="30" y="206" width="96" height="44" rx="5" fill="#fff" stroke="#B5D4F4" stroke-width="1"/>
  <text x="78" y="223" text-anchor="middle" font-size="10" font-weight="500" fill="#0C447C">Defeitos</text>
  <text x="78" y="236" text-anchor="middle" font-size="9" fill="#378ADD">413 pares bug/fix</text>

  <rect x="30" y="258" width="96" height="44" rx="5" fill="#fff" stroke="#B5D4F4" stroke-width="1"/>
  <text x="78" y="275" text-anchor="middle" font-size="10" font-weight="500" fill="#0C447C">Contexto</text>
  <text x="78" y="288" text-anchor="middle" font-size="9" fill="#378ADD">classe + método</text>

  <!-- ARROW 1→2 -->
  <line x1="136" y1="210" x2="152" y2="210" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ETAPA 2: PROMPT -->
  <rect x="152" y="60" width="116" height="300" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <rect x="152" y="60" width="116" height="28" rx="8" fill="#BA7517"/>
  <rect x="152" y="76" width="116" height="12" fill="#BA7517"/>
  <text x="210" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Geração de Prompt</text>

  <rect x="162" y="102" width="96" height="44" rx="5" fill="#fff" stroke="#FAC775" stroke-width="1"/>
  <text x="210" y="120" text-anchor="middle" font-size="10" font-weight="500" fill="#633806">Estilo</text>
  <text x="210" y="133" text-anchor="middle" font-size="9" fill="#BA7517">comment_extend</text>

  <rect x="162" y="154" width="96" height="44" rx="5" fill="#fff" stroke="#FAC775" stroke-width="1"/>
  <text x="210" y="171" text-anchor="middle" font-size="10" font-weight="500" fill="#633806">Code Features</text>
  <text x="210" y="184" text-anchor="middle" font-size="9" fill="#BA7517">FM_b, FC_c, FC_f…</text>

  <rect x="162" y="206" width="96" height="96" rx="5" fill="#fff" stroke="#FAC775" stroke-width="1"/>
  <text x="210" y="226" text-anchor="middle" font-size="10" font-weight="500" fill="#633806">Variante Usada</text>
  <text x="210" y="241" text-anchor="middle" font-size="9" fill="#BA7517">comment_</text>
  <text x="210" y="253" text-anchor="middle" font-size="9" fill="#BA7517">extend_full</text>
  <text x="210" y="267" text-anchor="middle" font-size="9" fill="#BA7517">1 de 128 possíveis</text>
  <text x="210" y="280" text-anchor="middle" font-size="9" fill="#BA7517">× 5 modelos</text>

  <!-- ARROW 2→3 -->
  <line x1="268" y1="210" x2="284" y2="210" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ETAPA 3: INFERÊNCIA -->
  <rect x="284" y="60" width="132" height="300" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <rect x="284" y="60" width="132" height="28" rx="8" fill="#3B6D11"/>
  <rect x="284" y="76" width="132" height="12" fill="#3B6D11"/>
  <text x="350" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Inferência LLM</text>

  <rect x="294" y="100" width="112" height="110" rx="5" fill="#fff" stroke="#C0DD97" stroke-width="1"/>
  <text x="350" y="117" text-anchor="middle" font-size="10" font-weight="500" fill="#27500A">Ollama (local)</text>
  <text x="350" y="130" text-anchor="middle" font-size="8.5" fill="#3B6D11">RTX 3050 · 6GB VRAM</text>
  <line x1="294" y1="137" x2="406" y2="137" stroke="#C0DD97" stroke-width="0.8"/>
  <text x="350" y="151" text-anchor="middle" font-size="9" fill="#639922">Gemma3 4B</text>
  <text x="350" y="163" text-anchor="middle" font-size="9" fill="#639922">DeepSeek R1 1.5B</text>
  <text x="350" y="175" text-anchor="middle" font-size="9" fill="#639922">DeepSeek R1 8B</text>
  <text x="350" y="187" text-anchor="middle" font-size="9" fill="#639922">Mistral 7B</text>
  <text x="350" y="199" text-anchor="middle" font-size="8" fill="#888">Q4_K_M</text>

  <rect x="294" y="220" width="112" height="84" rx="5" fill="#fff" stroke="#C0DD97" stroke-width="1"/>
  <text x="350" y="238" text-anchor="middle" font-size="10" font-weight="500" fill="#27500A">Groq API (cloud)</text>
  <text x="350" y="251" text-anchor="middle" font-size="8.5" fill="#3B6D11">LPU · BF16</text>
  <line x1="294" y1="257" x2="406" y2="257" stroke="#C0DD97" stroke-width="0.8"/>
  <text x="350" y="272" text-anchor="middle" font-size="9" fill="#639922">Llama 4 Scout 17B</text>
  <text x="350" y="285" text-anchor="middle" font-size="8" fill="#888">BF16 / FP8</text>

  <rect x="294" y="315" width="112" height="30" rx="5" fill="#EAF3DE" stroke="#C0DD97" stroke-width="1"/>
  <text x="350" y="334" text-anchor="middle" font-size="9" fill="#27500A">classes de teste Java</text>

  <!-- ARROW 3→4 -->
  <line x1="416" y1="210" x2="432" y2="210" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ETAPA 4: EXECUÇÃO -->
  <rect x="432" y="60" width="116" height="300" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
  <rect x="432" y="60" width="116" height="28" rx="8" fill="#A32D2D"/>
  <rect x="432" y="76" width="116" height="12" fill="#A32D2D"/>
  <text x="490" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Execução D4J</text>

  <rect x="442" y="102" width="96" height="38" rx="5" fill="#fff" stroke="#F7C1C1" stroke-width="1"/>
  <text x="490" y="118" text-anchor="middle" font-size="10" font-weight="500" fill="#501313">Compilar</text>
  <text x="490" y="131" text-anchor="middle" font-size="9" fill="#A32D2D">JDK + JUnit</text>

  <rect x="442" y="148" width="96" height="38" rx="5" fill="#fff" stroke="#F7C1C1" stroke-width="1"/>
  <text x="490" y="164" text-anchor="middle" font-size="10" font-weight="500" fill="#501313">Executar</text>
  <text x="490" y="177" text-anchor="middle" font-size="9" fill="#A32D2D">versão buggy + fixed</text>

  <rect x="442" y="194" width="96" height="38" rx="5" fill="#fff" stroke="#F7C1C1" stroke-width="1"/>
  <text x="490" y="210" text-anchor="middle" font-size="10" font-weight="500" fill="#501313">Cobertura</text>
  <text x="490" y="223" text-anchor="middle" font-size="9" fill="#A32D2D">JaCoCo</text>

  <rect x="442" y="240" width="96" height="38" rx="5" fill="#fff" stroke="#F7C1C1" stroke-width="1"/>
  <text x="490" y="256" text-anchor="middle" font-size="10" font-weight="500" fill="#501313">Detecção</text>
  <text x="490" y="269" text-anchor="middle" font-size="9" fill="#A32D2D">pass fix / fail bug</text>

  <rect x="442" y="286" width="96" height="34" rx="5" fill="#FCEBEB" stroke="#F7C1C1" stroke-width="1"/>
  <text x="490" y="300" text-anchor="middle" font-size="8.5" fill="#501313">3.885 avaliações</text>
  <text x="490" y="312" text-anchor="middle" font-size="8.5" fill="#501313">777 × 5 modelos</text>

  <!-- ARROW 4→5 -->
  <line x1="548" y1="210" x2="564" y2="210" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ETAPA 5: MÉTRICAS -->
  <rect x="564" y="60" width="116" height="300" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <rect x="564" y="60" width="116" height="28" rx="8" fill="#534AB7"/>
  <rect x="564" y="76" width="116" height="12" fill="#534AB7"/>
  <text x="622" y="79" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Métricas</text>

  <rect x="574" y="102" width="96" height="44" rx="5" fill="#fff" stroke="#CECBF6" stroke-width="1"/>
  <text x="622" y="119" text-anchor="middle" font-size="11" font-weight="500" fill="#26215C">CSR</text>
  <text x="622" y="133" text-anchor="middle" font-size="9" fill="#534AB7">compilation rate</text>

  <rect x="574" y="154" width="96" height="44" rx="5" fill="#fff" stroke="#CECBF6" stroke-width="1"/>
  <text x="622" y="171" text-anchor="middle" font-size="11" font-weight="500" fill="#26215C">CovL / CovB</text>
  <text x="622" y="185" text-anchor="middle" font-size="9" fill="#534AB7">line / branch cov.</text>

  <rect x="574" y="206" width="96" height="44" rx="5" fill="#fff" stroke="#CECBF6" stroke-width="1"/>
  <text x="622" y="223" text-anchor="middle" font-size="11" font-weight="500" fill="#26215C">NDD</text>
  <text x="622" y="237" text-anchor="middle" font-size="9" fill="#534AB7">defeitos detectados</text>

  <rect x="574" y="258" width="96" height="62" rx="5" fill="#fff" stroke="#CECBF6" stroke-width="1"/>
  <text x="622" y="276" text-anchor="middle" font-size="10" font-weight="500" fill="#26215C">Wilcoxon</text>
  <text x="622" y="289" text-anchor="middle" font-size="9" fill="#534AB7">signed-rank test</text>
  <text x="622" y="302" text-anchor="middle" font-size="9" fill="#534AB7">rank-biserial r</text>

  <!-- STEP NUMBERS -->
  <circle cx="78" cy="44" r="13" fill="#378ADD"/>
  <text x="78" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">1</text>

  <circle cx="210" cy="44" r="13" fill="#BA7517"/>
  <text x="210" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">2</text>

  <circle cx="350" cy="44" r="13" fill="#3B6D11"/>
  <text x="350" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">3</text>

  <circle cx="490" cy="44" r="13" fill="#A32D2D"/>
  <text x="490" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">4</text>

  <circle cx="622" cy="44" r="13" fill="#534AB7"/>
  <text x="622" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">5</text>

  <!-- TITLE -->
  <text x="350" y="20" text-anchor="middle" font-size="13" font-weight="500" fill="#111">Pipeline de Avaliação — LLM4UT</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
