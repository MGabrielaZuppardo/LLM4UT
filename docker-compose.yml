services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  llm4ut:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm4ut:latest
    container_name: llm4ut
    volumes:
      - .:/app
      - ./data:/app/data
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
